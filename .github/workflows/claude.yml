name: Claude Code

# Запуск Claude по упоминанию @claude в issue, комментариях и ревью PR.
# Оплата — по подписке Claude через секрет CLAUDE_CODE_OAUTH_TOKEN.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Инструменты, чтобы Claude мог собрать Android-приложение.
      # Версии держите такими же, как в android.yml.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Токен для gh: права ограничены блоком permissions выше.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Разрешённые инструменты: через запятую, без пробелов, одной строкой в кавычках.
          # Claude Code проверяет каждую часть составной команды (cd X && git clone ... | tar ...),
          # поэтому здесь есть и служебные команды оболочки. Состав:
          #   сборка и Android: dotnet, java, keytool, apksigner, zipalign, aapt2, sdkmanager, ilspycmd, pwsh;
          #   git и сеть: git (вкл. clone), gh, curl, wget;
          #   архивы: tar, unzip, zip, gzip;
          #   скрипты: bash, sh, python3, jq;
          #   файлы и текст: cd, ls, cat, find, grep, sed, awk, cp, mv, rm, mkdir и т. п.;
          #   без Bash: Read, Edit, Write, Glob, Grep, WebFetch, WebSearch, TodoWrite.
          # Если Claude снова попросит разрешение на какую-то команду — допишите её сюда
          # или замените весь список одним словом "Bash" (разрешит любые команды).
          claude_args: |
            --allowedTools "Bash(dotnet:*),Bash(java:*),Bash(keytool:*),Bash(apksigner:*),Bash(zipalign:*),Bash(aapt2:*),Bash(sdkmanager:*),Bash(ilspycmd:*),Bash(pwsh:*),Bash(git:*),Bash(gh:*),Bash(curl:*),Bash(wget:*),Bash(tar:*),Bash(unzip:*),Bash(zip:*),Bash(gzip:*),Bash(bash:*),Bash(sh:*),Bash(python3:*),Bash(jq:*),Bash(cd:*),Bash(pwd),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(xargs:*),Bash(tee:*),Bash(diff:*),Bash(cmp:*),Bash(file:*),Bash(stat:*),Bash(du:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(touch:*),Bash(chmod:*),Bash(ln:*),Bash(echo:*),Bash(printf:*),Bash(test:*),Bash(export:*),Bash(env:*),Bash(which:*),Bash(realpath:*),Bash(dirname:*),Bash(basename:*),Bash(date:*),Bash(sleep:*),Bash(timeout:*),Bash(true),Bash(base64:*),Bash(sha256sum:*),Bash(strings:*),Bash(od:*),Bash(uname:*),Bash(nproc),Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,TodoWrite"
