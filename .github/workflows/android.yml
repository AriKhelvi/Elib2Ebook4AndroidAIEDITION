# ============================================================================
# E2E для Android — автосборка APK в GitHub Actions
# ----------------------------------------------------------------------------
# [AI-EDITION] Сгенерировано ИИ (Claude, Anthropic) под присмотром человека.
# Стабильность не гарантируется — см. android/README.md, раздел «Автосборка в GitHub Actions».
# ============================================================================
#
# Когда запускается:
#   - пуш в master, затрагивающий приложение или ядро  → APK в артефактах запуска (вкладка Actions);
#   - пуш в ветки claude/dev и codex/dev               → то же: APK для проверки ветки до слияния в master;
#   - ручной запуск (Actions → Android APK → Run workflow);
#   - публикация релиза на GitHub                       → APK прикрепляется к этому релизу;
#   - пуш тега vX.Y.Z-alpha.<агент>.<N> (тестовый релиз) → сборка + pre-release с APK, публикуется сам;
#     то же — ручной запуск на ветке с полем «alpha_tag»: CI сам ставит тег на собранный коммит
#     (схема тегов — в AGENTS.md, раздел «Тестовые (альфа) релизы»);
#   - pull request                                       → только проверка, что всё собирается.
#
# Подпись APK. Чтобы новая версия ставилась поверх установленной, APK должен быть подписан тем же ключом,
# что и раньше. Ключ хранится в секретах репозитория (Settings → Secrets and variables → Actions):
#   E2E_KEYSTORE_BASE64   — файл e2e.keystore в base64;
#   E2E_KEYSTORE_PASSWORD — пароль из password.txt.
# Без секретов обычная сборка подписывается одноразовым ключом (с предупреждением) — такой APK можно
# поставить только «с нуля». Сборка для релиза и альфы без секретов намеренно падает.

name: Android APK

on:
  push:
    branches: [ master, 'claude/dev', 'codex/dev' ]
    # Тестовые (альфа) релизы. Для тегов фильтр paths ниже GitHub не применяет
    tags: [ 'v*-alpha.*' ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'README.md'                 # из него берётся список сайтов для вкладки «Сайты»
      - 'Directory.Build.props'     # версия ядра = versionName приложения
      - 'Directory.Packages.props'
      - 'nuget.config'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      alpha_tag:
        description: 'Альфа-тег vX.Y.Z-alpha.<агент>.<N> (пусто — обычная сборка). CI поставит тег на этот коммит и опубликует pre-release'
        required: false
        type: string
        default: ''
      expected_sha:
        description: 'Ожидаемый коммит (начало хэша). Если в ветке уже другой — сборка остановится сразу, ничего не выпустив'
        required: false
        type: string
        default: ''

# contents: write — чтобы прикрепить APK к релизу
permissions:
  contents: write

# Новый пуш в ту же ветку отменяет недоделанную сборку предыдущего
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # .NET ставим в домашнюю папку раннера: в системную /usr/share/dotnet workload без sudo не поставить
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Архитектуры APK (через свойство проекта E2EAbi, см. комментарии в E2E.Droid.csproj):
      # arm64 — современные телефоны, arm (32 бита) — старые телефоны и большинство читалок на Android 7–10.
      # Обе в одном APK, чтобы не приходилось выбирать файл.
      E2E_ABI: android-arm64,android-arm

    steps:
      - name: Исходники
        uses: actions/checkout@v5
        with:
          # Вся история с тегами: версия приложения считается от последнего тега vX.Y.Z (git describe)
          fetch-depth: 0

      - name: .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Кэш NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'android/**/*.csproj', 'src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Workload MAUI для Android
        run: dotnet workload install maui-android

      # На раннере уже есть Android SDK ($ANDROID_SDK_ROOT); дотягиваем то, что нужно проекту (platform 36 и т.п.)
      - name: Android SDK
        run: >
          dotnet build android/E2E.Droid/E2E.Droid.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True

      # Схема версий (та же, что в android/build.ps1, — см. android/README.md, раздел «Версии»):
      #   релиз с тегом v0.2.0                 → версия 0.2.0,         файл E2E-0.2.0.apk
      #   5 коммитов после тега v0.2.0          → версия 0.2.1-dev.5,   файл E2E-0.2.1-dev.5-<коммит>.apk
      #   тегов ещё нет                         → версия 0.0.0-dev.<число коммитов>
      # versionCode — минуты с 01.01.2026: растёт сам с каждой сборкой, поэтому APK из Actions и собранные
      # локально ставятся друг поверх друга в правильном порядке. Версия ядра Elib2Ebook — отдельно.
      - name: Версия
        id: version
        env:
          # Через переменные, а не ${{ }} в тексте скрипта: поле ручного запуска — пользовательский ввод
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ALPHA_INPUT: ${{ inputs.alpha_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          CORE=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          SHA=${GITHUB_SHA::7}

          # Ручной запуск собирает то, что сейчас в ветке. Если туда успела запушить другая сессия, без этой проверки
          # альфа вышла бы с чужим коммитом — поэтому агенты передают expected_sha (см. AGENTS.md)
          EXPECTED=$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED" ]; then
            if ! [[ "$EXPECTED" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::expected_sha «$EXPECTED» — не хэш коммита (нужно 7–40 шестнадцатеричных символов)"
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$EXPECTED"* ]]; then
              echo "::error::В ветке коммит ${GITHUB_SHA::7}, а ожидался $EXPECTED: ветку обновили после запуска. Подтяните её и проверьте, что выпускаете"
              exit 1
            fi
          fi

          # Альфа (тестовый релиз): пуш тега или ручной запуск с полем alpha_tag — только по схеме из AGENTS.md
          ALPHA=""
          if [ "${{ github.event_name }}" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            ALPHA="$REF_NAME"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ALPHA=$(printf '%s' "$ALPHA_INPUT" | tr -d '[:space:]')
          fi
          if [ -n "$ALPHA" ]; then
            if ! [[ "$ALPHA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[a-z][a-z0-9]*\.[0-9]+$ ]]; then
              echo "::error::Альфа-тег «$ALPHA» не по схеме vX.Y.Z-alpha.<агент>.<N> (например v0.1.1-alpha.claude.1, см. AGENTS.md)"
              exit 1
            fi
            # Номер уже занят другим коммитом — не переставляем тег, нужен следующий N
            EXISTING=$(git rev-parse -q --verify "refs/tags/$ALPHA^{commit}" || true)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::Тег $ALPHA уже стоит на коммите ${EXISTING::7}, а собирается ${GITHUB_SHA::7}. Возьмите следующий номер альфы"
              exit 1
            fi
          fi
          echo "alpha=$ALPHA" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ] || [ -n "$ALPHA" ]; then
            TAG="${ALPHA:-$RELEASE_TAG}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Тег релиза «$TAG» не похож на версию. Нужен тег вида vX.Y.Z, например v0.1.0"
              exit 1
            fi
            VERSION=${TAG#v}
            NAME="E2E-$VERSION"
          else
            # Альфа-теги в версии сборок веток не участвуют: после альфы ветка остаётся «0.1.1-dev.N»
            DESC=$(git describe --tags --match 'v[0-9]*' --exclude '*-alpha.*' --long --abbrev=7 --always)
            if [[ "$DESC" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?-([0-9]+)-g[0-9a-f]+$ ]]; then
              MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
              SUFFIX=${BASH_REMATCH[4]}; AHEAD=${BASH_REMATCH[5]}
              if [ "$AHEAD" = "0" ]; then
                VERSION="$MAJOR.$MINOR.$PATCH$SUFFIX"
              elif [ -n "$SUFFIX" ]; then
                VERSION="$MAJOR.$MINOR.$PATCH$SUFFIX.dev.$AHEAD"
              else
                VERSION="$MAJOR.$MINOR.$((PATCH + 1))-dev.$AHEAD"
              fi
            else
              VERSION="0.0.0-dev.$(git rev-list --count HEAD)"
            fi
            NAME="E2E-$VERSION-$SHA"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "E2E $VERSION (ядро Elib2Ebook $CORE), коммит $SHA, versionCode $CODE"

      - name: Ключ подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.E2E_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.E2E_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/e2e.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            # Пароль — только через переменную окружения (как в build.ps1); в логах GitHub его маскирует
            echo "E2E_KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "kind=owner" >> "$GITHUB_OUTPUT"
            echo "Подпись: ключ владельца из секретов репозитория"
          else
            if [ "${{ github.event_name }}" = "release" ] || [ -n "${{ steps.version.outputs.alpha }}" ]; then
              echo "::error::Для релиза и альфы нужен ключ подписи: добавьте секреты E2E_KEYSTORE_BASE64 и E2E_KEYSTORE_PASSWORD (см. android/README.md)"
              exit 1
            fi
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias e2e -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=E2E temporary CI key" -noprompt
            echo "E2E_KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "kind=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты подписи не заданы — APK подписан ВРЕМЕННЫМ ключом и не встанет поверх уже установленного приложения"
          fi
          echo "keystore=$KS" >> "$GITHUB_OUTPUT"

      # Те же параметры, что в android/build.ps1. Важно: без -o и без -p:RuntimeIdentifiers —
      # глобальные свойства уходят во все 60+ библиотек ядра и ломают их сборку.
      # Список архитектур: в -p: и «;», и «,» MSBuild считает разделителями свойств, поэтому «,» → «+» (см. E2E.Droid.csproj).
      - name: Сборка APK
        run: >
          dotnet publish android/E2E.Droid/E2E.Droid.csproj -c Release -f net10.0-android -nologo -v:minimal
          -p:E2EAbi="${E2E_ABI//,/+}"
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:ApplicationDisplayVersion="${{ steps.version.outputs.version }}"
          -p:ApplicationVersion="${{ steps.version.outputs.code }}"
          -p:E2ECommit="${{ steps.version.outputs.sha }}"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ steps.signing.outputs.keystore }}"
          -p:AndroidSigningKeyAlias=e2e
          -p:AndroidSigningKeyPass=env:E2E_KS_PASS
          -p:AndroidSigningStorePass=env:E2E_KS_PASS

      - name: Проверка APK
        id: apk
        run: |
          SRC=$(ls android/E2E.Droid/bin/Release/net10.0-android/publish/*-Signed.apk | head -1)
          SUFFIX=$([ "${{ steps.signing.outputs.kind }}" = "temporary" ] && echo "-temp-key" || echo "")
          APK="$RUNNER_TEMP/${{ steps.version.outputs.name }}$SUFFIX.apk"
          cp "$SRC" "$APK"

          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          # Подпись (схема v2/v3) и выравнивание нативных библиотек под 16 КБ-страницы (новые Pixel)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          "$BT/zipalign" -c -P 16 4 "$APK"
          # Все сборки сайтов должны пережить тримминг (по одной libaot-*.so на сайт и архитектуру)
          SITES=$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/libaot-Elib2Ebook.ExternalServices' || true)
          SITES32=$(unzip -l "$APK" | grep -c 'lib/armeabi-v7a/libaot-Elib2Ebook.ExternalServices' || true)
          # [AI-EDITION] Число сайтов не проверяется: оно часто меняется (нерабочие загрузчики
          # исключаются списком E2EDisabledLoader в E2E.Droid.csproj), поэтому только печатается.
          echo "Сборок сайтов в APK: arm64 — $SITES, arm32 — $SITES32"
          [ "$SITES32" -eq "$SITES" ] || { echo "::error::32-битных сборок сайтов ($SITES32) не столько же, сколько 64-битных ($SITES)"; exit 1; }

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 ${{ steps.version.outputs.name }}$SUFFIX"
            echo ""
            echo "| | |"
            echo "|:--|:--|"
            echo "| Версия | ${{ steps.version.outputs.version }} |"
            echo "| Ядро Elib2Ebook | ${{ steps.version.outputs.core }} |"
            echo "| Размер | $(du -h "$APK" | cut -f1) |"
            echo "| versionCode | ${{ steps.version.outputs.code }} |"
            echo "| Сайтов | $SITES |"
            echo "| Подпись | ${{ steps.signing.outputs.kind == 'owner' && 'ключ владельца' || '⚠ временный ключ' }} |"
            echo "| SHA-256 сертификата | \`$(grep -m1 'SHA-256' "$RUNNER_TEMP/cert.txt" | awk '{print $NF}')\` |"
            echo ""
            echo "> [AI-EDITION] Сборка сгенерированного ИИ приложения — стабильность не гарантируется."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}${{ steps.signing.outputs.kind == 'temporary' && '-temp-key' || '' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          NAME=$(basename "$APK")
          # Несколько попыток: если релиз только что переименовали или перепубликовали,
          # API GitHub может какое-то время отвечать ошибкой
          for i in 1 2 3; do
            if gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "APK $NAME прикреплён к релизу $TAG"
              exit 0
            fi
            echo "Попытка $i не удалась, повтор через 15 с"
            sleep 15
          done
          # Файл с тем же именем уже в релизе (например, его прикрепила сборка до переименования тега) — не ошибка
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$NAME"; then
            echo "::notice::$NAME уже прикреплён к релизу $TAG — оставляю как есть"
            exit 0
          fi
          echo "::error::Не удалось прикрепить $NAME к релизу $TAG"
          exit 1

      # Тестовый (альфа) релиз: pre-release с APK, списком изменений и скрытой пометкой для ИИ-агентов.
      # При ручном запуске тег ставит сам релиз (--target = собранный коммит). Релиз и тег создаются токеном
      # Actions — они не запускают этот workflow ещё раз.
      - name: Альфа-релиз
        if: steps.version.outputs.alpha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.alpha }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          CORE: ${{ steps.version.outputs.core }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          AGENT=$(echo "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.([a-z0-9]+)\..*/\1/')
          BRANCHES=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' | sed 's#^origin/##' | grep -v '^HEAD$' | paste -sd ',' - | sed 's/,/, /g')
          STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_SHA" 2>/dev/null || true)
          if [ -n "$STABLE" ]; then
            CHANGES=$(git log --no-merges --format='- %s (%h)' "$STABLE..$GITHUB_SHA" | head -50)
          else
            CHANGES=$(git log --no-merges --format='- %s (%h)' -20 "$GITHUB_SHA")
          fi

          NOTES="$RUNNER_TEMP/alpha-notes.md"
          {
            echo "**Тестовая сборка (альфа)** — не стабильный релиз. Агент: $AGENT, ветка: ${BRANCHES:-?}, коммит $SHA, ядро Elib2Ebook $CORE."
            echo ""
            echo "Проверка на устройстве: «Настройки» → «Отладка» → «Запустить диагностику». Журнал сохранится файлом в папку загрузок приложения — его и нужно прислать."
            echo ""
            echo "### Изменения${STABLE:+ после $STABLE}"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "> [AI-EDITION] Приложение сгенерировано ИИ — стабильность не гарантируется."
            echo ""
            echo "<!-- Для ИИ-агентов (Claude, Codex и др.): это ТЕСТОВЫЙ релиз (альфа), не стабильный."
            echo "Тестовые релизы из веток тегируются по схеме vX.Y.Z-alpha.<агент>.<N>:"
            echo "X.Y.Z — следующая версия после последнего стабильного тега (после v0.1.0 — 0.1.1);"
            echo "<агент> — claude или codex (владелец ветки claude/dev или codex/dev);"
            echo "<N> — номер альфы этого агента для этой версии: 1, 2, 3…"
            echo "Тег ставится на уже запушенный коммит своей ветки: push тега или ручной запуск android.yml на ветке с alpha_tag — CI сам собирает APK и публикует pre-release."
            echo "Стабильные релизы vX.Y.Z — только владелец, из master. Подробнее — AGENTS.md, раздел «Тестовые (альфа) релизы». -->"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Перезапуск сборки того же тега: обновляем APK и описание
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "E2E $VERSION (альфа)" --notes-file "$NOTES"
          fi
          echo "Опубликован pre-release $TAG: $(basename "$APK")"
