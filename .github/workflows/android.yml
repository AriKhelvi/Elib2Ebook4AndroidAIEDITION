# ============================================================================
# E2E для Android — автосборка APK в GitHub Actions
# ----------------------------------------------------------------------------
# [AI-EDITION] Сгенерировано ИИ (Claude, Anthropic) под присмотром человека.
# Стабильность не гарантируется — см. android/README.md, раздел «Автосборка в GitHub Actions».
# ============================================================================
#
# Когда запускается:
#   - пуш в master, затрагивающий приложение или ядро  → APK в артефактах запуска (вкладка Actions);
#   - пуш в ветки claude/dev и codex/dev               → то же: APK для проверки ветки до слияния в master;
#   - ручной запуск (Actions → Android APK → Run workflow);
#   - ручной запуск владельцем из master с release_tag → черновик стабильного релиза с APK;
#   - публикация релиза на GitHub                       → проверка уже загруженного APK;
#   - пуш тега vX.Y.Z-alpha.<агент>.<N> (тестовый релиз) → сборка + pre-release с APK;
#     то же — ручной запуск на ветке с полем «alpha_tag». Автопубликация зависит от разрешений API
#     (ограничение GITHUB_TOKEN для изменений workflow — android/README.md; схема тегов — AGENTS.md);
#   - pull request                                       → только проверка, что всё собирается.
#
# Подпись APK. Чтобы новая версия ставилась поверх установленной, APK должен быть подписан тем же ключом,
# что и раньше. Ключ хранится в секретах репозитория (Settings → Secrets and variables → Actions):
#   E2E_KEYSTORE_BASE64   — файл e2e.keystore в base64;
#   E2E_KEYSTORE_PASSWORD — пароль из password.txt.
# Компиляция и PR используют только одноразовый ключ. Отдельное задание на свежем runner
# переподписывает APK ключом владельца; PR туда не допускаются. Без секретов релиз останавливается.

name: Android APK

on:
  push:
    branches: [ master, 'claude/dev', 'codex/dev' ]
    # Тестовые (альфа) релизы. Для тегов фильтр paths ниже GitHub не применяет
    tags: [ 'v*-alpha.*' ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'README.md'                 # из него берётся список сайтов для вкладки «Сайты»
      - 'Directory.Build.props'     # версия ядра = versionName приложения
      - 'Directory.Packages.props'
      - 'nuget.config'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Стабильный vX.Y.Z: только владелец из master с expected_sha. Создаёт draft с APK; владелец публикует после проверки'
        required: false
        type: string
        default: ''
      alpha_tag:
        description: 'Альфа vX.Y.Z-alpha.<агент>.<N> (пусто — обычная сборка). Изменения workflow относительно master могут потребовать действий владельца; см. README'
        required: false
        type: string
        default: ''
      expected_sha:
        description: 'Обязателен с release_tag или alpha_tag: ожидаемый хэш (7–40 символов). Если ветка изменилась, сборка сразу остановится'
        required: false
        type: string
        default: ''

# Запись нужна только сборке, которая готовит draft или публикует альфу.
permissions:
  contents: read

# Обычный пуш отменяет предыдущую сборку ветки, но не подготовку релиза.
concurrency:
  group: android-${{ github.event.release.tag_name || inputs.release_tag || inputs.alpha_tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  prepare:
    name: Проверка параметров релиза
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.prepare.outputs.kind }}
      tag: ${{ steps.prepare.outputs.tag }}
      build: ${{ steps.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - name: Тесты подготовки релизов
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Проверка владельца, ветки, коммита и тега
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release_tag }}
          ALPHA_INPUT: ${{ inputs.alpha_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 .github/scripts/android_release.py prepare

  published:
    name: Проверка опубликованного APK
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Проверка без изменения релиза
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/android_release.py verify

  apk:
    name: Сборка APK
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      code: ${{ steps.version.outputs.code }}
      sha: ${{ steps.version.outputs.sha }}
      name: ${{ steps.version.outputs.name }}
      alpha: ${{ steps.version.outputs.alpha }}
      stable: ${{ steps.version.outputs.stable }}

    env:
      RELEASE_INPUT: ${{ inputs.release_tag }}
      ALPHA_INPUT: ${{ inputs.alpha_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      # .NET ставим в домашнюю папку раннера: в системную /usr/share/dotnet workload без sudo не поставить
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Архитектуры APK (через свойство проекта E2EAbi, см. комментарии в E2E.Droid.csproj):
      # arm64 — современные телефоны, arm (32 бита) — старые телефоны и большинство читалок на Android 7–10.
      # Обе в одном APK, чтобы не приходилось выбирать файл.
      E2E_ABI: android-arm64,android-arm

    steps:
      - name: Исходники
        uses: actions/checkout@v5
        with:
          # Вся история с тегами: версия приложения считается от последнего тега vX.Y.Z (git describe)
          fetch-depth: 0
          persist-credentials: false

      - name: .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Кэш NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'android/**/*.csproj', 'src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Сервисные тесты
        run: dotnet test android/ServiceTests/ServiceTests.csproj -c Release --nologo -v:minimal

      - name: Темы, цвета и фокус элементов
        run: node --test android/UiTests/*.test.cjs

      - name: Workload MAUI для Android
        run: dotnet workload install maui-android

      # На раннере уже есть Android SDK ($ANDROID_SDK_ROOT); дотягиваем то, что нужно проекту (platform 36 и т.п.)
      - name: Android SDK
        run: >
          dotnet build android/E2E.Droid/E2E.Droid.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True

      - name: Проверка Android Debug
        run: dotnet build android/E2E.Droid/E2E.Droid.csproj -f net10.0-android -c Debug

      # Схема версий (та же, что в android/build.ps1, — см. android/README.md, раздел «Версии»):
      #   релиз с тегом v0.2.0                 → версия 0.2.0,         файл E2E-0.2.0.apk
      #   5 коммитов после тега v0.2.0          → версия 0.2.1-dev.5,   файл E2E-0.2.1-dev.5-<коммит>.apk
      #   тегов ещё нет                         → версия 0.0.0-dev.<число коммитов>
      # versionCode — минуты с 01.01.2026: растёт сам с каждой сборкой, поэтому APK из Actions и собранные
      # локально ставятся друг поверх друга в правильном порядке. Версия ядра Elib2Ebook — отдельно.
      - name: Версия
        id: version
        env:
          # Через переменные, а не ${{ }} в тексте скрипта: поле ручного запуска — пользовательский ввод
          PUBLISH_TAG: ${{ needs.prepare.outputs.tag }}
          PUBLISH_KIND: ${{ needs.prepare.outputs.kind }}
        run: |
          CORE=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          SHA=${GITHUB_SHA::7}

          # Параметры уже проверены до установки SDK; при загрузке APK они проверяются ещё раз.
          ALPHA=""
          STABLE=""
          if [ "$PUBLISH_KIND" = "alpha" ]; then ALPHA="$PUBLISH_TAG"; fi
          if [ "$PUBLISH_KIND" = "stable" ]; then STABLE="$PUBLISH_TAG"; fi
          echo "alpha=$ALPHA" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

          if [ -n "$PUBLISH_TAG" ]; then
            VERSION=${PUBLISH_TAG#v}
            NAME="E2E-$VERSION"
          else
            # Альфа-теги в версии сборок веток не участвуют: после альфы ветка остаётся «0.1.1-dev.N»
            DESC=$(git describe --tags --match 'v[0-9]*' --exclude '*-alpha.*' --long --abbrev=7 --always)
            if [[ "$DESC" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?-([0-9]+)-g[0-9a-f]+$ ]]; then
              MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
              SUFFIX=${BASH_REMATCH[4]}; AHEAD=${BASH_REMATCH[5]}
              if [ "$AHEAD" = "0" ]; then
                VERSION="$MAJOR.$MINOR.$PATCH$SUFFIX"
              elif [ -n "$SUFFIX" ]; then
                VERSION="$MAJOR.$MINOR.$PATCH$SUFFIX.dev.$AHEAD"
              else
                VERSION="$MAJOR.$MINOR.$((PATCH + 1))-dev.$AHEAD"
              fi
            else
              VERSION="0.0.0-dev.$(git rev-list --count HEAD)"
            fi
            NAME="E2E-$VERSION-$SHA"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "E2E $VERSION (ядро Elib2Ebook $CORE), коммит $SHA, versionCode $CODE"

      # Проект и тесты выполняются без ключа владельца, в том числе на same-repo PR.
      - name: Временный ключ сборки
        id: signing
        run: |
          KS="$RUNNER_TEMP/e2e.keystore"
          export E2E_KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_KS_PASS"
          keytool -genkeypair -keystore "$KS" -alias e2e -keyalg RSA -keysize 2048 -validity 30 \
            -storepass:env E2E_KS_PASS -keypass:env E2E_KS_PASS -dname "CN=E2E temporary CI key" -noprompt
          echo "E2E_KS_PASS=$E2E_KS_PASS" >> "$GITHUB_ENV"
          echo "kind=temporary" >> "$GITHUB_OUTPUT"
          echo "keystore=$KS" >> "$GITHUB_OUTPUT"

      # Те же параметры, что в android/build.ps1. Важно: без -o и без -p:RuntimeIdentifiers —
      # глобальные свойства уходят во все 60+ библиотек ядра и ломают их сборку.
      # Список архитектур: в -p: и «;», и «,» MSBuild считает разделителями свойств, поэтому «,» → «+» (см. E2E.Droid.csproj).
      - name: Сборка APK
        run: >
          dotnet publish android/E2E.Droid/E2E.Droid.csproj -c Release -f net10.0-android -nologo -v:minimal
          -p:E2EAbi="${E2E_ABI//,/+}"
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:ApplicationDisplayVersion="${{ steps.version.outputs.version }}"
          -p:ApplicationVersion="${{ steps.version.outputs.code }}"
          -p:E2ECommit="${{ steps.version.outputs.sha }}"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ steps.signing.outputs.keystore }}"
          -p:AndroidSigningKeyAlias=e2e
          -p:AndroidSigningKeyPass=env:E2E_KS_PASS
          -p:AndroidSigningStorePass=env:E2E_KS_PASS

      - name: Проверка APK
        id: apk
        run: |
          SRC=$(ls android/E2E.Droid/bin/Release/net10.0-android/publish/*-Signed.apk | head -1)
          SUFFIX=$([ "${{ steps.signing.outputs.kind }}" = "temporary" ] && echo "-temp-key" || echo "")
          APK="$RUNNER_TEMP/${{ steps.version.outputs.name }}$SUFFIX.apk"
          cp "$SRC" "$APK"

          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          # Подпись (схема v2/v3) и выравнивание нативных библиотек под 16 КБ-страницы (новые Pixel)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          "$BT/zipalign" -c -P 16 4 "$APK"
          # Все сборки сайтов должны пережить тримминг (по одной libaot-*.so на сайт и архитектуру)
          SITES=$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/libaot-Elib2Ebook.ExternalServices' || true)
          SITES32=$(unzip -l "$APK" | grep -c 'lib/armeabi-v7a/libaot-Elib2Ebook.ExternalServices' || true)
          # [AI-EDITION] Число сайтов не проверяется: оно часто меняется (нерабочие загрузчики
          # исключаются списком E2EDisabledLoader в E2E.Droid.csproj), поэтому только печатается.
          echo "Сборок сайтов в APK: arm64 — $SITES, arm32 — $SITES32"
          [ "$SITES32" -eq "$SITES" ] || { echo "::error::32-битных сборок сайтов ($SITES32) не столько же, сколько 64-битных ($SITES)"; exit 1; }

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 ${{ steps.version.outputs.name }}$SUFFIX"
            echo ""
            echo "| | |"
            echo "|:--|:--|"
            echo "| Версия | ${{ steps.version.outputs.version }} |"
            echo "| Ядро Elib2Ebook | ${{ steps.version.outputs.core }} |"
            echo "| Размер | $(du -h "$APK" | cut -f1) |"
            echo "| versionCode | ${{ steps.version.outputs.code }} |"
            echo "| Сайтов | $SITES |"
            echo "| Подпись | ${{ steps.signing.outputs.kind == 'owner' && 'ключ владельца' || '⚠ временный ключ' }} |"
            echo "| SHA-256 сертификата | \`$(grep -m1 'SHA-256' "$RUNNER_TEMP/cert.txt" | awk '{print $NF}')\` |"
            echo ""
            echo "> [AI-EDITION] Сборка сгенерированного ИИ приложения — стабильность не гарантируется."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}${{ steps.signing.outputs.kind == 'temporary' && '-temp-key' || '' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Удаление временного ключа сборки
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/e2e.keystore"
          echo "E2E_KS_PASS=" >> "$GITHUB_ENV"

  sign:
    name: Подпись и публикация APK
    needs: [prepare, apk]
    # В PR нет задания с ключом владельца или токеном записи.
    if: github.event_name != 'pull_request' && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_INPUT: ${{ inputs.release_tag }}
      ALPHA_INPUT: ${{ inputs.alpha_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      # Отдельный свежий runner: не выполняем здесь MSBuild, тесты или код приложения.
      - name: Данные для описания релиза
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: APK текущего запуска
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.apk.outputs.artifact }}
          path: ${{ runner.temp }}/apk-input
          merge-multiple: true
      - name: Подпись ключом владельца и проверка
        id: signed
        env:
          KEYSTORE_BASE64: ${{ secrets.E2E_KEYSTORE_BASE64 }}
          E2E_KS_PASS: ${{ secrets.E2E_KEYSTORE_PASSWORD }}
          APK_NAME: ${{ needs.apk.outputs.name }}
          PUBLISH_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/owner.keystore"
          trap 'rm -f -- "$KS"; unset KEYSTORE_BASE64 E2E_KS_PASS' EXIT
          [[ "$APK_NAME" =~ ^E2E-[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*$ ]] || { echo '::error::Некорректное имя APK'; exit 1; }
          mapfile -t INPUTS < <(find "$RUNNER_TEMP/apk-input" -type f -name '*.apk')
          [ "${#INPUTS[@]}" -eq 1 ] || { echo '::error::Ожидался один APK текущей сборки'; exit 1; }
          SRC="${INPUTS[0]}"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$E2E_KS_PASS" ]; then
            if [ -n "$PUBLISH_TAG" ]; then
              echo '::error::Для релиза нужен ключ владельца: E2E_KEYSTORE_BASE64 и E2E_KEYSTORE_PASSWORD'
              exit 1
            fi
            echo '::warning::Ключ владельца не задан; доступен только APK с временной подписью из задания сборки'
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          unset KEYSTORE_BASE64
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK="$RUNNER_TEMP/$APK_NAME.apk"
          # apksigner удаляет прежнюю временную подпись. Пароль не попадает в argv/GITHUB_ENV.
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias e2e \
            --ks-pass env:E2E_KS_PASS --key-pass env:E2E_KS_PASS --out "$APK" "$SRC"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          # API 26/27 — Android 8.0/8.1; проверка подписи не заменяет запуск на устройстве.
          "$BT/apksigner" verify --min-sdk-version 26 --max-sdk-version 27 "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "### APK с подписью владельца: $APK_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: APK с подписью владельца
        if: steps.signed.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.apk.outputs.name }}
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error

      - name: Черновик стабильного релиза с APK
        if: needs.apk.outputs.stable != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.signed.outputs.path }}
        run: python3 .github/scripts/android_release.py attach

      # Тестовый (альфа) релиз: pre-release с APK, списком изменений и скрытой пометкой для ИИ-агентов.
      # При разрешении API тег ставит сам релиз (target_commitish = собранный коммит).
      # При отказе Workflows:write helper объясняет действия владельца; PAT не используется.
      # Релиз и тег, созданные токеном Actions, не запускают этот workflow ещё раз.
      - name: Альфа-релиз
        if: needs.apk.outputs.alpha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.alpha }}
          APK: ${{ steps.signed.outputs.path }}
          VERSION: ${{ needs.apk.outputs.version }}
          CORE: ${{ needs.apk.outputs.core }}
          SHA: ${{ needs.apk.outputs.sha }}
        run: |
          AGENT=$(echo "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.([a-z0-9]+)\..*/\1/')
          BRANCHES=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' | sed 's#^origin/##' | grep -v '^HEAD$' | paste -sd ',' - | sed 's/,/, /g')
          STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_SHA" 2>/dev/null || true)
          if [ -n "$STABLE" ]; then
            CHANGES=$(git log --no-merges --format='- %s (%h)' "$STABLE..$GITHUB_SHA" | head -50)
          else
            CHANGES=$(git log --no-merges --format='- %s (%h)' -20 "$GITHUB_SHA")
          fi

          NOTES="$RUNNER_TEMP/alpha-notes.md"
          {
            echo "**Тестовая сборка (альфа)** — не стабильный релиз. Агент: $AGENT, ветка: ${BRANCHES:-?}, коммит $SHA, ядро Elib2Ebook $CORE."
            echo ""
            echo "Проверка на устройстве: «Настройки» → «Отладка» → «Запустить диагностику». Журнал сохранится файлом в папку загрузок приложения — его и нужно прислать."
            echo ""
            echo "### Изменения${STABLE:+ после $STABLE}"
            echo ""
            echo "$CHANGES"
            echo ""
